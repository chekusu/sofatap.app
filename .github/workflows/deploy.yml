name: Deploy

# Deploys sofatap.app to Cloudflare Workers Static Assets from GitHub, with no personal computer
# involved. Runs on every push to main (after the same checks as CI) and on demand.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README, 部署).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only run wrangler deploy --dry-run (nothing is uploaded)'
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of cancelling it mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy sofatap.app
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sofatap.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before deploying."
            exit 1
          fi

      - name: Tests and static checks
        run: npm run verify

      # Videos, posters and promo exports are not in git: take the copies the live site serves.
      - name: Mirror media from the live site
        run: node scripts/mirror-live-media.mjs --out "$RUNNER_TEMP/site-media"

      - name: Build the media-inclusive site
        run: |
          node scripts/build.mjs --out dist --media "$RUNNER_TEMP/site-media/media"
          node scripts/check.mjs --media "$RUNNER_TEMP/site-media/media"
          node scripts/mirror-live-media.mjs --out "$RUNNER_TEMP/site-media" --verify dist
          mkdir -p dist/exports
          cp "$RUNNER_TEMP/site-media/exports/"*.mp4 dist/exports/

      - name: Prepare deploy files
        run: npm run deploy:prepare

      - name: Wrangler dry run
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --dry-run

      - name: Deploy
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
